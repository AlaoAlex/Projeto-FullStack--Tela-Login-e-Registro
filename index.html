<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            <div class="form-box active" id="login-form">
                <form action="">
                    <h2>Entrar</h2>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p>Não tem uma conta? <a href="#" onclick="mostrarForm('register-form')">Criar conta</a></p>
                </form>
            </div>
            <div class="form-box" id="register-form">
                <form action="">
                    <h2>Criar conta</h2>
                    <input type="text" name="name" placeholder="Nome" required>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <select name="role" required>
                        <option value="" disabled selected>Selecione um tipo de conta</option>
                        <option value="user">Usuário</option>
                        <option value="admin">Administrador</option>
                    </select>
                    <button type="submit">Criar conta</button>
                    <p>Já tem uma conta? <a href="#" onclick="mostrarForm('login-form')">Entrar</a></p>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
